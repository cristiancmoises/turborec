name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Compile and run unit tests
        run: |
          python -m py_compile turborec.py
          python -m unittest discover -s tests -v
          python turborec.py --version

      - name: Validate shell entry points
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n turborecorder
          bash -n packaging/build-deb.sh
          bash -n packaging/build-rpm.sh
          bash -n packaging/build-appimage.sh
          bash -n packaging/publish-release.sh

  freebsd:
    name: FreeBSD / native capabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test inside FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y python3 ffmpeg
          run: |
            set -eu
            python3 -m py_compile turborec.py
            python3 -m unittest discover -s tests -v
            python3 turborec.py --version
            ffmpeg -hide_banner -devices 2>&1 | grep -q 'oss'
            python3 turborec.py detect --json > detect.json
            python3 -c 'import json; d=json.load(open("detect.json")); assert d["os"] == "freebsd"'
