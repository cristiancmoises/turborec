name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run release-gate tests
        run: |
          python -m py_compile turborec.py
          python -m unittest discover -s tests -v
          python turborec.py --version

      - name: Require the tag and source version to match
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

  linux:
    name: Build Linux packages + portable tarball
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm fakeroot file libfuse2 wget \
            librsvg2-bin desktop-file-utils imagemagick

      - name: Build packages
        env:
          # build-appimage.sh self-downloads a pinned appimagetool and runs it
          # with --appimage-extract-and-run, so no FUSE is required on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x packaging/build-*.sh
          packaging/build-deb.sh
          packaging/build-rpm.sh
          packaging/build-appimage.sh
          # Architecture-independent tarball — installs on any Unix (incl. the BSDs).
          packaging/build-tarball.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Exclude the downloaded appimagetool itself (it is an *.AppImage too).
          find . -path ./dist -prune -o \
            \( -name '*.deb' -o -name '*.rpm' -o -iname '*.AppImage' \) \
            ! -iname 'appimagetool*' -type f -print -exec cp -f {} dist/ \;
          echo "Artifacts:"
          ls -l dist

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  freebsd:
    name: Build FreeBSD package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build + smoke-test the FreeBSD .pkg in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # python3 is needed both to read VERSION cleanly and to smoke-test the
          # installed package; pkg(8) itself is part of the base FreeBSD image.
          prepare: |
            pkg install -y python3
          run: |
            set -eu
            sh packaging/build-freebsd-pkg.sh
            echo "== smoke test: install the built package =="
            pkg add -f dist/turborec-*.pkg
            turborec --version
            pkg delete -y turborec

      - name: Upload FreeBSD build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-freebsd
          path: |
            dist/*.pkg
          if-no-files-found: error

  windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch + verify a pinned static FFmpeg to bundle
        shell: bash
        env:
          # Pinned, immutable gyan.dev build (has x264/x265/nvenc/qsv/amf/aac).
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip
          FFMPEG_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec
        run: |
          set -eu
          curl -L --retry 3 -o ffmpeg.zip "$FFMPEG_URL"
          echo "${FFMPEG_SHA256}  ffmpeg.zip" | sha256sum -c -   # abort on tamper/mismatch
          7z x -y ffmpeg.zip >/dev/null
          cp "$(find . -type f -name ffmpeg.exe  | head -1)" ffmpeg.exe
          cp "$(find . -type f -name ffprobe.exe | head -1)" ffprobe.exe
          ./ffmpeg.exe -version | head -1

      - name: Build a self-contained .exe (ffmpeg bundled) with PyInstaller
        shell: bash
        run: |
          set -eu
          python -m pip install --upgrade pip && python -m pip install "pyinstaller==6.21.0"
          # tkinter is imported lazily inside the GUI, so collect it explicitly;
          # ffmpeg/ffprobe are bundled so the app needs nothing preinstalled.
          pyinstaller --onefile --name turborec \
            --collect-submodules tkinter --hidden-import tkinter \
            --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." \
            turborec.py
          # Byte-safe version read (turborec.py has UTF-8 glyphs that Windows'
          # default cp1252 text mode can't decode).
          VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)
          mkdir -p out
          cp dist/turborec.exe "out/Turbo_Recorder-${VER}-windows-x64.exe"
          ls -l out

      - name: Smoke-test the executable (must find its bundled ffmpeg)
        shell: bash
        run: |
          set -eu
          ./dist/turborec.exe --version
          # The bundled build must expose every Windows capture backend.
          ./ffmpeg.exe -hide_banner -devices 2>&1 | grep -q 'dshow'
          ./ffmpeg.exe -hide_banner -devices 2>&1 | grep -q 'gdigrab'
          # Exercise a real encode, not only FFmpeg discovery.
          ./ffmpeg.exe -hide_banner -loglevel error \
            -f lavfi -i color=size=64x64:rate=1 -frames:v 1 \
            -c:v libx264 -f null -
          # Machine-readable probes must stay valid even though hosted runners
          # normally have no physical microphone or camera.
          ./dist/turborec.exe detect --json > detect.json
          ./dist/turborec.exe devices --json > devices.json
          ./dist/turborec.exe cameras --json > cameras.json
          ./dist/turborec.exe targets --json > targets.json
          python -c "import json; paths=('detect.json','devices.json','cameras.json','targets.json'); data=[json.load(open(p, encoding='utf-8')) for p in paths]; assert data[3] and data[3][0]['kind'] == 'screen'"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            out/*.exe
          if-no-files-found: error

  guix:
    name: Build GNU Guix relocatable pack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Build a relocatable (-RR) binary tarball
        run: |
          set -eux
          guix pack -RR -S /bin=bin -e "(primitive-load \"$PWD/guix.scm\")" > pack.txt
          PACK="$(tail -1 pack.txt)"
          VER="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          mkdir -p out
          cp "$PACK" "out/turborec-${VER}-guix-x86_64.tar.gz"
          ls -l out

      - name: Upload Guix build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-guix
          path: |
            out/*.tar.gz
          if-no-files-found: error

  publish:
    name: Verify and publish the complete release
    runs-on: ubuntu-latest
    needs: [linux, freebsd, windows, guix]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download every platform artifact
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify the complete asset set and create checksums
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          EXPECTED="
          Turbo_Recorder-${VERSION}-windows-x64.exe
          Turbo_Recorder-${VERSION}-x86_64.AppImage
          turborec-${VERSION}-1.noarch.rpm
          turborec-${VERSION}-1.src.rpm
          turborec-${VERSION}-guix-x86_64.tar.gz
          turborec-${VERSION}.pkg
          turborec-${VERSION}.tar.gz
          turborec_${VERSION}_all.deb"
          for name in ${EXPECTED}; do
            test -s "release-assets/${name}" || {
              echo "::error::Missing or empty release asset: ${name}"
              exit 1
            }
          done
          ACTUAL="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          WANTED="$(printf '%s\n' ${EXPECTED} | LC_ALL=C sort)"
          test "${ACTUAL}" = "${WANTED}" || {
            echo "::error::Unexpected release asset set"
            diff -u <(printf '%s\n' "${WANTED}") <(printf '%s\n' "${ACTUAL}") || true
            exit 1
          }
          (
            cd release-assets
            sha256sum ${EXPECTED} | LC_ALL=C sort -k2 > SHA256SUMS
          )

      - name: Publish the release atomically
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Verify every GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          EXPECTED="
          SHA256SUMS
          Turbo_Recorder-${VERSION}-windows-x64.exe
          Turbo_Recorder-${VERSION}-x86_64.AppImage
          turborec-${VERSION}-1.noarch.rpm
          turborec-${VERSION}-1.src.rpm
          turborec-${VERSION}-guix-x86_64.tar.gz
          turborec-${VERSION}.pkg
          turborec-${VERSION}.tar.gz
          turborec_${VERSION}_all.deb"
          ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.assets[].name' | LC_ALL=C sort)"
          WANTED="$(printf '%s\n' ${EXPECTED} | LC_ALL=C sort)"
          test "${ACTUAL}" = "${WANTED}" || {
            diff -u <(printf '%s\n' "${WANTED}") <(printf '%s\n' "${ACTUAL}") || true
            exit 1
          }
