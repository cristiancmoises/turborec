name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build pinned ZUPT for Linux archive round-trip tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sh packaging/install-zupt.sh "${RUNNER_TEMP}/zupt/bin"
          echo "${RUNNER_TEMP}/zupt/bin" >> "${GITHUB_PATH}"

      - name: Run release-gate tests
        run: |
          python -m py_compile turborec.py
          python -m unittest discover -s tests -v
          python turborec.py --version

      - name: Validate real CPU video output
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          TURBOREC_FFMPEG_TESTS=1 python -m unittest discover -s tests -p test_turborec.py -v

      - name: Require the tag and source version to match
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

  linux:
    name: Build Linux packages + portable ZUPT archives
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm fakeroot file libfuse2 wget \
            librsvg2-bin desktop-file-utils imagemagick \
            nsis p7zip-full build-essential curl

      - name: Build the verified pinned ZUPT compressor
        run: |
          set -eu
          sh packaging/install-zupt.sh "${RUNNER_TEMP}/zupt/bin"
          echo "${RUNNER_TEMP}/zupt/bin" >> "${GITHUB_PATH}"

      - name: Build packages
        env:
          # build-appimage.sh self-downloads a pinned appimagetool and runs it
          # with --appimage-extract-and-run, so no FUSE is required on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x packaging/build-*.sh
          packaging/build-deb.sh
          packaging/build-rpm.sh
          packaging/build-appimage.sh
          packaging/build-windows.sh
          # Architecture-independent TAR-in-ZUPT — portable Unix payload.
          packaging/build-tarball.sh
          # Complete immutable source tree for downstream repositories.
          packaging/build-source-tarball.sh

      - name: Test the actual portable and source archive round trips
        run: python3 -m unittest discover -s tests -p test_release_metadata.py -v

      - name: Collect only the required Linux-built release assets
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          mkdir -p "${RUNNER_TEMP}/release-linux"
          for name in \
            "Turbo_Recorder-${VERSION}-windows-x64-setup.exe" \
            "Turbo_Recorder-${VERSION}-x86_64.AppImage" \
            "turborec-${VERSION}-1.noarch.rpm" \
            "turborec-${VERSION}-1.src.rpm" \
            "turborec-${VERSION}-source.zupt" \
            "turborec-${VERSION}.zupt" \
            "turborec_${VERSION}_all.deb"; do
            test -s "dist/${name}"
            cp "dist/${name}" "${RUNNER_TEMP}/release-linux/${name}"
          done

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: ${{ runner.temp }}/release-linux/*
          if-no-files-found: error

  freebsd:
    name: Build FreeBSD package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build + smoke-test the FreeBSD .pkg in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Test the package against FreeBSD's stock FFmpeg and native OSS
          # capture backend; pkg(8) itself is part of the base image.
          prepare: |
            pkg install -y python3 ffmpeg
          run: |
            set -eu
            sh packaging/build-freebsd-pkg.sh
            echo "== smoke test: install the built package =="
            pkg add -f dist/turborec-*.pkg
            turborec --version
            ffmpeg -hide_banner -devices 2>&1 | grep -q 'oss'
            turborec detect --json > detect.json
            python3 -c 'import json; d=json.load(open("detect.json")); assert d["os"] == "freebsd"'
            turborec record --mode video_only --resolution native --dry-run
            pkg delete -y turborec

      - name: Upload FreeBSD build artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-freebsd
          path: |
            dist/*.pkg
          if-no-files-found: error

  windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: [test, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch + verify a pinned static FFmpeg to bundle
        shell: bash
        env:
          # Pinned, immutable gyan.dev build (has x264/x265/nvenc/qsv/amf/aac).
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip
          FFMPEG_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec
        run: |
          set -eu
          curl -L --retry 3 -o ffmpeg.zip "$FFMPEG_URL"
          echo "${FFMPEG_SHA256}  ffmpeg.zip" | sha256sum -c -   # abort on tamper/mismatch
          7z x -y ffmpeg.zip >/dev/null
          cp "$(find . -type f -name ffmpeg.exe  | head -1)" ffmpeg.exe
          cp "$(find . -type f -name ffprobe.exe | head -1)" ffprobe.exe
          ./ffmpeg.exe -version | head -1

      - name: Validate pixel fidelity with the bundled FFmpeg build
        shell: bash
        run: |
          set -euo pipefail
          PATH="${PWD}:${PATH}" TURBOREC_FFMPEG_TESTS=1 python -m unittest discover -s tests -p test_turborec.py -v

      - name: Build a self-contained .exe (ffmpeg bundled) with PyInstaller
        shell: bash
        run: |
          set -eu
          python -m pip install --upgrade pip && python -m pip install "pyinstaller==6.21.0"
          # tkinter is imported lazily inside the GUI, so collect it explicitly;
          # ffmpeg/ffprobe are bundled so the app needs nothing preinstalled.
          pyinstaller --onefile --name turborec \
            --collect-submodules tkinter --hidden-import tkinter \
            --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." \
            turborec.py
          # Byte-safe version read (turborec.py has UTF-8 glyphs that Windows'
          # default cp1252 text mode can't decode).
          VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)
          mkdir -p out
          cp dist/turborec.exe "out/Turbo_Recorder-${VER}-windows-x64.exe"
          ls -l out

      - name: Smoke-test the executable (must find its bundled ffmpeg)
        shell: bash
        run: |
          set -eu
          ./dist/turborec.exe --version
          # The bundled build must expose every Windows capture backend.
          ./ffmpeg.exe -hide_banner -devices 2>&1 | grep -q 'dshow'
          ./ffmpeg.exe -hide_banner -devices 2>&1 | grep -q 'gdigrab'
          # Exercise a real encode, not only FFmpeg discovery.
          ./ffmpeg.exe -hide_banner -loglevel error \
            -f lavfi -i color=size=64x64:rate=1 -frames:v 1 \
            -c:v libx264 -f null -
          # Machine-readable probes must stay valid even though hosted runners
          # normally have no physical microphone or camera.
          ./dist/turborec.exe detect --json > detect.json
          ./dist/turborec.exe devices --json > devices.json
          ./dist/turborec.exe cameras --json > cameras.json
          ./dist/turborec.exe targets --json > targets.json
          python -c "import json; paths=('detect.json','devices.json','cameras.json','targets.json'); data=[json.load(open(p, encoding='utf-8')) for p in paths]; assert data[3] and data[3][0]['kind'] == 'screen'"

      - name: Download the compiled Windows setup for installation checks
        uses: actions/download-artifact@v5
        with:
          name: release-linux
          path: ${{ runner.temp }}/turborec-linux-assets

      - name: Install setup and validate its actual launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP/turborec-linux-assets/*-windows-x64-setup.exe")
          if ($setups.Count -ne 1) { throw 'Expected exactly one Windows setup' }
          $destination = Join-Path $env:RUNNER_TEMP 'turborec-installed-smoke'
          $install = Start-Process -FilePath $setups[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }
          $launcher = Join-Path $destination 'turborec.cmd'
          if (!(Test-Path $launcher)) { throw 'Setup did not install the CLI launcher' }
          & $launcher --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed version command failed' }
          & $launcher --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed help command failed' }
          & $launcher --definitely-unknown-option
          if ($LASTEXITCODE -ne 2) { throw 'Launcher lost the engine exit code' }
          & $launcher detect --json | Out-File -Encoding utf8 "$destination/detect.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed detection failed' }
          $detected = Get-Content -Raw "$destination/detect.json" | ConvertFrom-Json
          if ($detected.os -ne 'windows') { throw 'Installed probe did not recognize Windows' }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: |
            out/*.exe
          if-no-files-found: error

  guix:
    name: Build GNU Guix relocatable pack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install GNU Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Build the verified pinned ZUPT compressor
        run: |
          set -eu
          sh packaging/install-zupt.sh "${RUNNER_TEMP}/zupt/bin"
          echo "${RUNNER_TEMP}/zupt/bin" >> "${GITHUB_PATH}"

      - name: Build a relocatable (-RR) TAR and compress it once with ZUPT
        run: |
          set -eu
          guix pack -RR --compression=none --system=x86_64-linux -S /bin=bin \
            -e "(primitive-load \"$PWD/guix.scm\")" > pack.txt
          PACK="$(tail -1 pack.txt)"
          VER="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          WORK="$(mktemp -d "${RUNNER_TEMP}/guix-zupt.XXXXXX")"
          trap 'rm -rf -- "${WORK}"' EXIT
          cp "$PACK" "${WORK}/turborec-${VER}-guix-x86_64.tar"
          mkdir -p out
          sh packaging/build-zupt-archive.sh \
            "${WORK}/turborec-${VER}-guix-x86_64.tar" \
            "$PWD/out/turborec-${VER}-guix-x86_64.zupt"
          ls -l out

      - name: Upload Guix build artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-guix
          path: |
            out/*.zupt
          if-no-files-found: error

  publish:
    name: Verify and publish the complete release
    runs-on: ubuntu-latest
    needs: [linux, freebsd, windows, guix]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build the verified pinned ZUPT validator
        run: |
          set -eu
          sh packaging/install-zupt.sh "${RUNNER_TEMP}/zupt/bin"
          echo "${RUNNER_TEMP}/zupt/bin" >> "${GITHUB_PATH}"

      - name: Download every platform artifact
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify the complete asset set and create checksums
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          EXPECTED="
          Turbo_Recorder-${VERSION}-windows-x64.exe
          Turbo_Recorder-${VERSION}-windows-x64-setup.exe
          Turbo_Recorder-${VERSION}-x86_64.AppImage
          turborec-${VERSION}-1.noarch.rpm
          turborec-${VERSION}-1.src.rpm
          turborec-${VERSION}-guix-x86_64.zupt
          turborec-${VERSION}.pkg
          turborec-${VERSION}-source.zupt
          turborec-${VERSION}.zupt
          turborec_${VERSION}_all.deb"
          for name in ${EXPECTED}; do
            test -s "release-assets/${name}" || {
              echo "::error::Missing or empty release asset: ${name}"
              exit 1
            }
          done
          ACTUAL="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          WANTED="$(printf '%s\n' ${EXPECTED} | LC_ALL=C sort)"
          test "${ACTUAL}" = "${WANTED}" || {
            echo "::error::Unexpected release asset set"
            diff -u <(printf '%s\n' "${WANTED}") <(printf '%s\n' "${ACTUAL}") || true
            exit 1
          }
          (
            cd release-assets
            for archive in *.zupt; do zupt test "${archive}"; done
            sha256sum ${EXPECTED} | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Prepare public release notes from only this changelog section
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          mkdir -p .git/release-work
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path
          version = sys.argv[1]
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)',
                            text, re.MULTILINE | re.DOTALL)
          if not match or not match.group(1).strip():
              raise SystemExit('Current version is missing from CHANGELOG.md')
          Path('.git/release-work/release-notes.txt').write_text(
              'Turbo Recorder ' + version + '\n\n' + match.group(1).strip() + '\n',
              encoding='utf-8')
          PY

      - name: Stage all assets on a draft release
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .git/release-work/release-notes.txt
          files: |
            release-assets/*
          fail_on_unmatched_files: true

      - name: Verify every draft asset name and downloaded checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -eu
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' turborec.py | head -1)"
          EXPECTED="
          SHA256SUMS
          Turbo_Recorder-${VERSION}-windows-x64.exe
          Turbo_Recorder-${VERSION}-windows-x64-setup.exe
          Turbo_Recorder-${VERSION}-x86_64.AppImage
          turborec-${VERSION}-1.noarch.rpm
          turborec-${VERSION}-1.src.rpm
          turborec-${VERSION}-guix-x86_64.zupt
          turborec-${VERSION}.pkg
          turborec-${VERSION}-source.zupt
          turborec-${VERSION}.zupt
          turborec_${VERSION}_all.deb"
          ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.assets[].name' | LC_ALL=C sort)"
          WANTED="$(printf '%s\n' ${EXPECTED} | LC_ALL=C sort)"
          test "${ACTUAL}" = "${WANTED}" || {
            diff -u <(printf '%s\n' "${WANTED}") <(printf '%s\n' "${ACTUAL}") || true
            exit 1
          }
          VERIFY="$(mktemp -d "${RUNNER_TEMP}/release-verify.XXXXXX")"
          trap 'rm -rf -- "${VERIFY}"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.assets[] | [.id, .name] | @tsv' > "${VERIFY}/assets.tsv"
          while IFS=$'\t' read -r asset_id name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${VERIFY}/${name}"
          done < "${VERIFY}/assets.tsv"
          cmp release-assets/SHA256SUMS "${VERIFY}/SHA256SUMS"
          (cd "${VERIFY}" && sha256sum -c SHA256SUMS)

      - name: Promote the fully verified release as latest
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          body_path: .git/release-work/release-notes.txt

      - name: Verify the public latest-release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "${GITHUB_REF_NAME}"
